
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexStore NG | Your Tech Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#172033}
header{background:#101b35;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold;color:#35d5a0}
.cart{background:#35d5a0;color:#102033;border:0;padding:10px 15px;border-radius:8px;font-weight:bold}
.hero{background:linear-gradient(120deg,#101b35,#174d62);color:white;padding:55px 7%;text-align:center}
.hero h1{font-size:35px;margin-bottom:12px}
.hero p{margin-bottom:20px}
.hero a{background:#35d5a0;color:#102033;padding:12px 22px;text-decoration:none;border-radius:7px;font-weight:bold}
.search{padding:22px 5%;text-align:center}
.search input{width:100%;max-width:500px;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.categories{text-align:center;padding:10px}
.categories button{padding:10px 15px;margin:5px;border:0;border-radius:20px;background:#e0e9ed;cursor:pointer}
.categories button.active{background:#102b46;color:white}
h2{text-align:center;margin:25px 0}
.products{padding:10px 5% 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:17px}
.product{background:white;padding:13px;border-radius:12px;box-shadow:0 3px 12px #0000000d}
.product img{width:100%;height:140px;object-fit:contain;background:#f5f6fa;border-radius:8px}
.product h3{font-size:16px;margin:12px 0 7px}
.price{color:#087d5a;font-weight:bold;margin-bottom:12px}
.product button{width:100%;padding:11px;background:#102b46;color:white;border:0;border-radius:7px;cursor:pointer}
.product button:hover{background:#087d5a}
.cart-area{background:white;padding:25px 6%;margin:20px 5%;border-radius:12px}
.cart-area p{margin:12px 0}
.checkout{background:#087d5a;color:white;border:0;padding:13px 20px;border-radius:7px;font-weight:bold;width:100%;cursor:pointer}
footer{background:#101b35;color:white;text-align:center;padding:25px}
</style>
</head>
<body>

<header>
<div class="logo">FlexStore NG</div>
<button class="cart" onclick="document.getElementById('cart').scrollIntoView()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<h1>Your Favourite Tech Store</h1>
<p>Smartphones, accessories and gadgets at great prices.</p>
<a href="#products">Shop Now</a>
</section>

<div class="search">
<input id="search" type="search" placeholder="Search phones and accessories..." oninput="renderProducts()">
</div>

<div class="categories">
<button class="active" onclick="setCategory('All',this)">All</button>
<button onclick="setCategory('Phones',this)">Phones</button>
<button onclick="setCategory('Accessories',this)">Accessories</button>
<button onclick="setCategory('Gadgets',this)">Gadgets</button>
</div>

<h2 id="products">Explore Our Products</h2>
<div class="products" id="productList"></div>

<section class="cart-area" id="cart">
<h2>🛒 Your Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<p><strong>Total: ₦<span id="total">0</span></strong></p>
<button class="checkout" onclick="checkout()">Order via WhatsApp</button>
</section>

<footer>
<h3>FlexStore NG</h3>
<p>Your trusted destination for phones and gadgets.</p>
<p>© 2026 FlexStore NG. All rights reserved.</p>
</footer>

<script>
const products=[
{name:"iPhone 15",price:850000,category:"Phones",image:"https://placehold.co/300x200?text=iPhone+15"},
{name:"Samsung Galaxy S24",price:780000,category:"Phones",image:"https://placehold.co/300x200?text=Samsung+S24"},
{name:"Redmi Note 13",price:250000,category:"Phones",image:"https://placehold.co/300x200?text=Redmi+Note+13"},
{name:"Oraimo Earbuds",price:35000,category:"Accessories",image:"https://placehold.co/300x200?text=Earbuds"},
{name:"Phone Charger",price:12000,category:"Accessories",image:"https://placehold.co/300x200?text=Charger"},
{name:"Power Bank",price:28000,category:"Gadgets",image:"https://placehold.co/300x200?text=Power+Bank"},
{name:"Bluetooth Speaker",price:45000,category:"Gadgets",image:"https://placehold.co/300x200?text=Speaker"},
{name:"Phone Case",price:8000,category:"Accessories",image:"https://placehold.co/300x200?text=Phone+Case"}
];

let cart=[];
let category="All";

function setCategory(value,button){
category=value;
document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));
button.classList.add('active');
renderProducts();
}

function renderProducts(){
const query=document.getElementById('search').value.toLowerCase();
const filtered=products.filter(p=>
(category==="All"||p.category===category)&&p.name.toLowerCase().includes(query)
);
document.getElementById('productList').innerHTML=filtered.map((p,i)=>`
<div class="product">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<div class="price">₦${p.price.toLocaleString('en-NG')}</div>
<button onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>
</div>`).join('')||'<p>No products found.</p>';
}

function addToCart(index){
cart.push(products[index]);
updateCart();
}

function updateCart(){
document.getElementById('count').textContent=cart.length;
document.getElementById('cartItems').innerHTML=cart.length?
cart.map((p,i)=>`<p>${p.name} — ₦${p.price.toLocaleString('en-NG')} <button onclick="removeItem(${i})">Remove</button></p>`).join('')
:'Your cart is empty.';
const total=cart.reduce((sum,p)=>sum+p.price,0);
document.getElementById('total').textContent=total.toLocaleString('en-NG');
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function checkout(){
if(!cart.length){
alert("Your cart is empty!");
return;
}
const phone="2340000000000";
const items=cart.map(p=>p.name+" - ₦"+p.price.toLocaleString('en-NG')).join("\n");
const total=cart.reduce((sum,p)=>sum+p.price,0);
const message="Hello FlexStore NG! I want to order:\n"+items+"\nTotal: ₦"+total.toLocaleString('en-NG');
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message),"_blank");
}

renderProducts();
</script>
</body>
</html>
